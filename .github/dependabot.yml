version: 2
updates:
  - package-ecosystem: npm
    # pnpm-lock.yaml と package.json があるディレクトリ。
    # 単独 repo として運用するので "/"。
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

    # 8 日 cooldown: routine version-update を publish から 8 日経過するまで待たせる。
    # pnpm-workspace.yaml の minimumReleaseAge (7 日) + 1 日 buffer の意図的カップリング。
    # cooldown は日単位・minimumReleaseAge は分単位なので、buffer で粒度差と clock skew を
    # 吸収し「PR を即 merge しても install gate を超えた版 = CI green = Cloudflare deploy 可」を保証する。
    # 注意: security update は cooldown を bypass する仕様 (version-update 専用) なので、
    # 稀に 7 日未満の版を持つ PR が生成され得る。その PR は CI `audit` job の
    # `pnpm install --frozen-lockfile` で fail (赤) し branch protection が merge をブロックするため
    # Cloudflare には到達しない。対応は同 PR 内で該当 exact version を minimumReleaseAgeExclude に
    # 追記して緑にする (README「young version をマージする時の運用」節)。
    cooldown:
      default-days: 8

    # patch/minor は 1 PR にまとめてレビュー負担を減らす。major は個別 PR。
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor

    # PR title prefix
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  # GitHub Actions (.github/workflows/*.yml の `uses:`) を SHA pin で管理。
  # pinact で初期 hash-pin 済み。Dependabot は SHA を最新版に bump しつつ
  # 末尾のバージョンコメント (`# vX.Y.Z`) も更新する。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

    cooldown:
      default-days: 7

    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor

    commit-message:
      prefix: ci
