name: CI

on:
  pull_request:
  push:
    branches: [main]

# 最小権限 (defense in depth)。job 単位で必要なら override する。
permissions:
  contents: read

jobs:
  audit:
    name: audit & install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # GitHub Actions が full SHA + version comment 形式で pin されているか検証。
      # Dependabot は SHA+comment 形式を維持するので routine update は問題ないが、
      # 手で `@v4` 等 mutable ref に書き戻された場合の regression を検知する。
      - name: Verify actions are pinned to full SHA (pinact)
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      # 1. lockfile ベース audit (install 前、即 fail-fast)
      - name: pnpm audit
        run: pnpm audit

      # 2. install (young version は pnpm-workspace.yaml の
      #    minimumReleaseAgeExclude で grandfather 済みなので flag 不要)
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # 3. 公式 npm 署名検証
      - name: pnpm audit:signatures
        run: pnpm audit:signatures

  verify:
    name: ${{ matrix.task }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [check, build, test, build-storybook, test-storybook, e2e]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      # audit ゲートが既に通っているので、ここは pnpm store cache から高速 install
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # e2e のみ Playwright が `pnpm dev` を起動し Wrangler runtime が `.dev.vars` を読むので、
      # 1Password の `template-vp-cf-hono-inertia-react-local` vault (local 開発と共用) から
      # `.dev.vars` Item を inject する。Service Account はこの vault に read-only でスコープ。
      # OP_SERVICE_ACCOUNT_TOKEN は inject step 限定の env で参照し、後続の e2e 実行 step では
      # 露出させない (生成された `.dev.vars` のみが残る)。他の matrix task (check/build/test/
      # storybook) には secret が一切渡らない。
      - name: Install 1Password CLI (e2e only)
        if: matrix.task == 'e2e'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Inject .dev.vars from 1Password (e2e only)
        if: matrix.task == 'e2e'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm secrets:pull:ci

      - name: Run ${{ matrix.task }}
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            check)
              pnpm check
              ;;
            build)
              pnpm build
              ;;
            test)
              pnpm test:run
              ;;
            build-storybook)
              pnpm build-storybook
              ;;
            test-storybook)
              # `pnpm test-storybook` は `vitest run --project storybook` (Vitest 4 browser mode
              # + @vitest/browser-playwright + @storybook/addon-vitest + storybook-addon-vis)。
              # 旧来必要だった `pnpm build-storybook` + `http-server` 経由の Storybook iframe
              # 提供は不要 (Vitest が直接 portable-story を render する)。
              # Playwright chromium だけは引き続き必要。
              pnpm exec playwright install --with-deps chromium
              pnpm test-storybook
              ;;
            e2e)
              pnpm exec playwright install --with-deps chromium
              pnpm e2e
              ;;
          esac

      # 1Password から inject した secrets ファイルを task 完了直後に削除する。
      # `if: always()` で task が失敗しても必ず走らせる。GitHub-hosted runner は job 終了で
      # 破棄されるが、後続 step が artifact upload を始める前にディスクから消すことで
      # 露出窓を最小化する (defense in depth)。`.env` は `secrets:pull:ci` では書かない
      # 想定だが、`rm -f` は idempotent なので念のため両方を消す。
      - name: Remove injected secrets files
        if: always() && matrix.task == 'e2e'
        run: rm -f .dev.vars .env
