name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    name: audit & install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      # `pnpm install --config.minimum-release-age=0` で install すると state file が
      # minimumReleaseAge="0" を記録し、workspace.yaml の 10080 と drift する。
      # この drift を後続 `pnpm <cmd>` が ERR_PNPM_VERIFY_DEPS_BEFORE_RUN で拒むため、
      # CI 内だけ severity を error → warn に下げる。CLI flag や env では伝播しないので
      # workspace.yaml を直接書き換える (CI VM 内で完結、commit しない)。
      - name: Tolerate verify-deps drift in CI
        run: sed -i 's/^verifyDepsBeforeRun: error$/verifyDepsBeforeRun: warn/' pnpm-workspace.yaml

      # 1. lockfile ベース audit (install 前、即 fail-fast)
      - name: pnpm audit
        run: pnpm audit

      # 2. install (CI 上だけ minimumReleaseAge を一時無視)
      - name: pnpm install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      # 3. 公式 npm 署名検証
      - name: pnpm audit:signatures
        run: pnpm audit:signatures

  verify:
    name: ${{ matrix.task }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [check, build, test, build-storybook, test-storybook, e2e]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Tolerate verify-deps drift in CI
        run: sed -i 's/^verifyDepsBeforeRun: error$/verifyDepsBeforeRun: warn/' pnpm-workspace.yaml

      # audit ゲートが既に通っているので、ここは pnpm store cache から高速 install
      - name: pnpm install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Run ${{ matrix.task }}
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            check)
              pnpm check
              ;;
            build)
              pnpm build
              ;;
            test)
              pnpm test:run
              ;;
            build-storybook)
              pnpm build-storybook
              ;;
            test-storybook)
              pnpm build-storybook
              npx --yes http-server storybook-static -p 6006 --silent > /tmp/sb.log 2>&1 &
              npx --yes wait-on http://localhost:6006 --timeout 90000
              pnpm test-storybook
              ;;
            e2e)
              pnpm exec playwright install --with-deps chromium
              pnpm e2e
              ;;
          esac
