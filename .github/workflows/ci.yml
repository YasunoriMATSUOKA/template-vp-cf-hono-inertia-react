name: CI

on:
  pull_request:
  push:
    branches: [main]

# pnpm install --config.minimum-release-age=0 を使うと state file に "0" が記録され、
# pnpm-workspace.yaml の minimumReleaseAge: 10080 と drift する。
# CI では audit が install 前に通っているため drift を error から warn に下げて許容する。
env:
  npm_config_verify_deps_before_run: warn

jobs:
  audit:
    name: audit & install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      # 1. lockfile ベース audit (install 前、即 fail-fast)
      - name: pnpm audit
        run: pnpm audit

      # 2. install (CI 上だけ minimumReleaseAge を一時無視)
      - name: pnpm install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      # 3. 公式 npm 署名検証 (install 後の node_modules ツリーが必要)
      - name: pnpm audit:signatures
        run: pnpm audit:signatures

  verify:
    name: ${{ matrix.task }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [check, build, test, build-storybook, test-storybook, e2e]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      # audit ゲートが既に通っているので、ここは pnpm store cache から高速 install
      - name: pnpm install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Run ${{ matrix.task }}
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            check)
              pnpm check
              ;;
            build)
              pnpm build
              ;;
            test)
              pnpm test:run
              ;;
            build-storybook)
              pnpm build-storybook
              ;;
            test-storybook)
              pnpm build-storybook
              npx --yes http-server storybook-static -p 6006 --silent > /tmp/sb.log 2>&1 &
              npx --yes wait-on http://localhost:6006 --timeout 90000
              pnpm test-storybook
              ;;
            e2e)
              pnpm exec playwright install --with-deps chromium
              pnpm e2e
              ;;
          esac
