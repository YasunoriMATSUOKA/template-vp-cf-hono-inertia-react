name: CI

on:
  pull_request:
  push:
    branches: [main]

# 最小権限 (defense in depth)。job 単位で必要なら override する。
permissions:
  contents: read

jobs:
  audit:
    name: audit & install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GitHub Actions が full SHA + version comment 形式で pin されているか検証。
      # Dependabot は SHA+comment 形式を維持するので routine update は問題ないが、
      # 手で `@v4` 等 mutable ref に書き戻された場合の regression を検知する。
      - name: Verify actions are pinned to full SHA (pinact)
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with:
          skip_push: "true"

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      # `pnpm install --config.minimum-release-age=0` で install すると state file が
      # minimumReleaseAge="0" を記録し、workspace.yaml の 10080 と drift する。
      # この drift を後続 `pnpm <cmd>` が ERR_PNPM_VERIFY_DEPS_BEFORE_RUN で拒むため、
      # CI 内だけ severity を error → warn に下げる。CLI flag や env では伝播しないので
      # workspace.yaml を直接書き換える (CI VM 内で完結、commit しない)。
      - name: Tolerate verify-deps drift in CI
        run: |
          sed -i 's/^verifyDepsBeforeRun: error$/verifyDepsBeforeRun: warn/' pnpm-workspace.yaml

      # 1. lockfile ベース audit (install 前、即 fail-fast)
      - name: pnpm audit
        run: pnpm audit

      # 2. install (CI 上だけ minimumReleaseAge を一時無視)
      - name: pnpm install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      # 3. 公式 npm 署名検証
      - name: pnpm audit:signatures
        run: pnpm audit:signatures

  verify:
    name: ${{ matrix.task }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [check, build, test, build-storybook, test-storybook, e2e]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Tolerate verify-deps drift in CI
        run: |
          sed -i 's/^verifyDepsBeforeRun: error$/verifyDepsBeforeRun: warn/' pnpm-workspace.yaml

      # audit ゲートが既に通っているので、ここは pnpm store cache から高速 install
      - name: pnpm install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      # e2e のみ Playwright が `pnpm dev` を起動し Wrangler runtime が `.dev.vars` を読むので、
      # 1Password の `template-vp-cf-hono-inertia-react-local` vault (local 開発と共用) から
      # `.dev.vars` Item を inject する。Service Account はこの vault に read-only でスコープ。
      # OP_SERVICE_ACCOUNT_TOKEN は inject step 限定の env で参照し、後続の e2e 実行 step では
      # 露出させない (生成された `.dev.vars` のみが残る)。他の matrix task (check/build/test/
      # storybook) には secret が一切渡らない。
      - name: Install 1Password CLI (e2e only)
        if: matrix.task == 'e2e'
        uses: 1password/install-cli-action@8d006a0d0a4fd505af7f7ce589e7f768385ff5e4 # v3.0.0

      - name: Inject .dev.vars from 1Password (e2e only)
        if: matrix.task == 'e2e'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm secrets:pull:ci

      - name: Run ${{ matrix.task }}
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            check)
              pnpm check
              ;;
            build)
              pnpm build
              ;;
            test)
              pnpm test:run
              ;;
            build-storybook)
              pnpm build-storybook
              ;;
            test-storybook)
              pnpm build-storybook
              # test-storybook は内部で Playwright (chromium) を使う
              pnpm exec playwright install --with-deps chromium
              npx --yes http-server storybook-static -p 6006 --silent > /tmp/sb-http.log 2>&1 &
              HTTP_PID=$!
              for i in $(seq 1 90); do
                curl -sf http://localhost:6006 > /dev/null 2>&1 && break
                sleep 1
              done
              if ! curl -sf http://localhost:6006 > /dev/null 2>&1; then
                echo "Storybook server did not come up within 90s. Log:"
                cat /tmp/sb-http.log
                exit 1
              fi
              pnpm test-storybook
              RESULT=$?
              kill $HTTP_PID 2>/dev/null || true
              exit $RESULT
              ;;
            e2e)
              pnpm exec playwright install --with-deps chromium
              pnpm e2e
              ;;
          esac

      # 1Password から inject した secrets ファイルを task 完了直後に削除する。
      # `if: always()` で task が失敗しても必ず走らせる。GitHub-hosted runner は job 終了で
      # 破棄されるが、後続 step が artifact upload を始める前にディスクから消すことで
      # 露出窓を最小化する (defense in depth)。`.env` は `secrets:pull:ci` では書かない
      # 想定だが、`rm -f` は idempotent なので念のため両方を消す。
      - name: Remove injected secrets files
        if: always() && matrix.task == 'e2e'
        run: rm -f .dev.vars .env
