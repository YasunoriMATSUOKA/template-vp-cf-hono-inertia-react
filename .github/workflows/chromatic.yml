name: Chromatic

# Storybook と Playwright (E2E) の実行結果を Chromatic にアップロードしてクラウド側で
# ビジュアル回帰レビューする。ci.yml (合意済み構成) には手を入れず独立 workflow にしている。
# Chromatic は baseline 追跡に全 git 履歴を要するため checkout は fetch-depth: 0。
#
# Chromatic は Storybook と E2E (Playwright) で *別プロジェクト* を要求するため、token も 2 つ必要。
# 同一 repo にリンクした 2 project を作り、それぞれの project token を repo の Actions secret に登録する。
#
# 必要な secret:
#   - CHROMATIC_STORYBOOK_PROJECT_TOKEN  : Storybook 用 Chromatic project の token
#   - CHROMATIC_PLAYWRIGHT_PROJECT_TOKEN : Playwright (E2E) 用 Chromatic project の token
#   - OP_SERVICE_ACCOUNT_TOKEN           : 1Password Service Account (playwright job のみ。ci.yml と共用)
#
# snapshot 消費を抑えたい場合は on: を push (branches: [main]) のみに絞ってもよい。
on:
  pull_request:
  push:
    branches: [main]

# 最小権限 (defense in depth)。
permissions:
  contents: read

jobs:
  # Storybook をビルドして Chromatic にアップロード (secret は CHROMATIC のみ)。
  chromatic-storybook:
    name: chromatic-storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic の baseline 追跡に全 git 履歴が必須
          fetch-depth: 0

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@fd5e7e8b66d1a6862ed8866c21e93788217f7cf7 # v18.6.0
        with:
          projectToken: ${{ secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
          # build-storybook の出力を指す (action 側で再ビルドさせない)
          storybookBuildDir: storybook-static
          # 視覚変化を CI 失敗にせず Chromatic 上のレビュー扱いにする。
          # 変化を必ずレビューゲートにしたい場合はこの行を削除する。
          exitZeroOnChanges: true

  # E2E を実行して archive を生成し Chromatic にアップロード。
  # `pnpm dev` (Wrangler runtime) が `.dev.vars` を読むため 1Password 注入が必要。
  chromatic-playwright:
    name: chromatic-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm (packageManager 準拠)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ci.yml の e2e task と同じ 1Password 注入パターン。OP_SERVICE_ACCOUNT_TOKEN は
      # inject step 限定の env で参照し、後続 step には露出させない。
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Inject .dev.vars from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm secrets:pull:ci

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # `@chromatic-com/playwright` が各ページの archive を `test-results/chromatic-archives/`
      # (= Playwright の outputDir 既定 `test-results` 内の `chromatic-archives/` サブフォルダ) に生成し、
      # 後続の `chromatic --playwright` が同じ既定パスから読み取る (CHROMATIC_ARCHIVE_LOCATION で上書き可)。
      - name: Run E2E (generates Chromatic archives)
        run: pnpm e2e

      - name: Upload archives to Chromatic
        env:
          # chromatic CLI は CHROMATIC_PROJECT_TOKEN env を読む。Playwright 用 project の token を渡す。
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PLAYWRIGHT_PROJECT_TOKEN }}
        run: pnpm exec chromatic --playwright --exit-zero-on-changes

      # 1Password から inject した secrets を必ず削除 (失敗時も走らせる)。
      - name: Remove injected secrets files
        if: always()
        run: rm -f .dev.vars .env
