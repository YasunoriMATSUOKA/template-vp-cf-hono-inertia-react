allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  # GHSA-67mh-4wv8-2f99: esbuild <=0.24.2 dev server リクエスト偽装
  # drizzle-kit > @esbuild-kit/esm-loader (deprecated) > esbuild@0.18.20 経路。
  # @esbuild-kit/* は tsx に置き換えられて更新が止まっているので強制 up しか手が無い。
  esbuild: ">=0.24.3"
  # GHSA-58qx-3vcg-4xpx: ws <8.20.1 uninitialized memory disclosure
  # @cloudflare/vite-plugin > miniflare が "ws":"8.18.0" で完全固定。
  # 最新 miniflare (4.20260518.0) でも同じ pin が確認されたため、override で patch 版に上げる。
  ws: ">=8.20.1"
  # @better-auth/kysely-adapter@1.6.14 は kysely root から
  # DEFAULT_MIGRATION_TABLE / DEFAULT_MIGRATION_LOCK_TABLE を import するが、
  # kysely 0.29.0 でこれらの root re-export が削除され build が [MISSING_EXPORT] で失敗する。
  # adapter の互換宣言 (^0.28.17 || ^0.29.0) の ^0.29 が誤り。symbol が再公開されるか
  # adapter が deep import / 自前定義に変わるまで、互換のある 0.28.17 に固定する。
  kysely: 0.28.17

# --- サプライチェーン強化 ---

# 公開から 10080 分 (= 7 日) 経過した version のみ install を許可。
# publish 直後に乗っ取られた version を踏まないための cooldown。
# 単位は分なので注意 (npm の min-release-age は日単位)。個別除外は
# minimumReleaseAgeExclude に列挙する。
minimumReleaseAge: 10080

# 公開 7 日未満で lockfile に固定された package の grandfather list。
# Cloudflare Workers Builds の dashboard には install command 指定欄が無く、
# `--config.minimum-release-age=0` を install に渡す経路が無いので、policy
# 例外を明示的に列挙する以外に deploy 通す方法が無い。
# 生成: `node scripts/find-young-deps.mjs` の出力を貼る。
# 運用: lockfile 更新 (Dependabot security PR 等) で新規 young version が
# 入るたび、同 PR でこのリストも更新する。age を過ぎたものは半年に 1 度
# くらいで整理 (再 `find-young-deps.mjs` で diff を取る)。
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin"
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
  - "@types/node"
  - "@unrs/resolver-binding-android-arm-eabi"
  - "@unrs/resolver-binding-android-arm64"
  - "@unrs/resolver-binding-darwin-arm64"
  - "@unrs/resolver-binding-darwin-x64"
  - "@unrs/resolver-binding-freebsd-x64"
  - "@unrs/resolver-binding-linux-arm-gnueabihf"
  - "@unrs/resolver-binding-linux-arm-musleabihf"
  - "@unrs/resolver-binding-linux-arm64-gnu"
  - "@unrs/resolver-binding-linux-arm64-musl"
  - "@unrs/resolver-binding-linux-ppc64-gnu"
  - "@unrs/resolver-binding-linux-riscv64-gnu"
  - "@unrs/resolver-binding-linux-riscv64-musl"
  - "@unrs/resolver-binding-linux-s390x-gnu"
  - "@unrs/resolver-binding-linux-x64-gnu"
  - "@unrs/resolver-binding-linux-x64-musl"
  - "@unrs/resolver-binding-openharmony-arm64"
  - "@unrs/resolver-binding-wasm32-wasi"
  - "@unrs/resolver-binding-win32-arm64-msvc"
  - "@unrs/resolver-binding-win32-ia32-msvc"
  - "@unrs/resolver-binding-win32-x64-msvc"
  - "@vitejs/plugin-react"
  - baseline-browser-mapping
  - caniuse-lite
  - daisyui
  - electron-to-chromium
  - enhanced-resolve
  - hono
  - lru-cache
  - miniflare
  - tsx
  - unrs-resolver
  - vite
  - workerd
  - wrangler

# 新規 install/add で ^/~ を付けず exact 版で書く。
# 既存の ^ は scripts/pin-deps.mjs で別途剥がす。
saveExact: true

# engines.node 範囲外の Node で install/run を fail。
engineStrict: true

# pnpm dev / pnpm test 等の起動前に node_modules と lockfile の同期を強制検証。
# 'error' で drift 即 fail。'warn' に下げると警告のみ。
# 旧来は `pnpm install --config.minimum-release-age=0` で生じる state file の
# drift を許容するために warn に下げていたが、minimumReleaseAgeExclude で
# young version を policy 例外にする方式に切り替えたため、override 不要で
# drift も起きなくなり error に復帰可能。
verifyDepsBeforeRun: error

# install 末尾の "X packages are looking for funding" を非表示。
fund: false
