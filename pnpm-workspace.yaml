allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  # esbuild の既知脆弱性を override で patch 版に強制 up する (transitive 経路が多数:
  # @hono/inertia>vite>esbuild、better-auth>drizzle-kit>@esbuild-kit/* など。
  # @esbuild-kit/* は tsx に置き換えられ更新停止のため強制 up しか手が無い)。
  # - GHSA-67mh-4wv8-2f99: <=0.24.2 dev server リクエスト偽装
  # - GHSA-gv7w-rqvm-qjhr (high) / GHSA-g7r4-m6w7-qqqr (low): <0.28.1。patched >=0.28.1
  esbuild: ">=0.28.1"
  # GHSA-58qx-3vcg-4xpx: ws <8.20.1 uninitialized memory disclosure
  # @cloudflare/vite-plugin > miniflare が "ws":"8.18.0" で完全固定。
  # 最新 miniflare (4.20260518.0) でも同じ pin が確認されたため、override で patch 版に上げる。
  ws: ">=8.20.1"
  # @better-auth/kysely-adapter@1.6.14 は kysely root から
  # DEFAULT_MIGRATION_TABLE / DEFAULT_MIGRATION_LOCK_TABLE を import するが、
  # kysely 0.29.0 でこれらの root re-export が削除され build が [MISSING_EXPORT] で失敗する。
  # adapter の互換宣言 (^0.28.17 || ^0.29.0) の ^0.29 が誤り。symbol が再公開されるか
  # adapter が deep import / 自前定義に変わるまで、互換のある 0.28.17 に固定する。
  kysely: 0.28.17

# --- サプライチェーン強化 ---

# 公開から 10080 分 (= 7 日) 経過した version のみ install を許可。
# publish 直後に乗っ取られた version を踏まないための cooldown。
# 単位は分なので注意 (npm の min-release-age は日単位)。個別除外は
# minimumReleaseAgeExclude に列挙する。
minimumReleaseAge: 10080

# 公開 7 日未満で lockfile に固定された package の grandfather list。
# Cloudflare Workers Builds の dashboard には install command 指定欄が無く、
# `--config.minimum-release-age=0` を install に渡す経路が無いので、policy
# 例外を明示的に列挙する以外に deploy 通す方法が無い。
#
# 方式: **exact version 固定** (`name@version`)。bare name や glob (`@scope/*`) でも
# 効くが、それだと当該 package の全 version が age gate 対象外になり security が緩む。
# exact version なら「列挙した特定版のみ免除・将来版は 7 日 gate 維持」となり、
# minimumReleaseAge の効果 (= npm audit レベル) を一切下げない。
#
# 生成: `node scripts/find-young-deps.mjs` の出力 (`- "name@version"` 形式) で
#       **このリストを全置換**する。漏れがあれば install が fail、余りは stale。
# 運用: lockfile 更新 (Dependabot security PR / 手動 override 等) で新規 young version が
#       入るたび、同 PR で再生成・全置換する。age を過ぎた版は次の lockfile 更新時に
#       リストから自然に消える (再生成すれば出力されないため)。
#
# 現状の中身は esbuild override (>=0.28.1, GHSA-gv7w-rqvm-qjhr / GHSA-g7r4-m6w7-qqqr の
# patch) が強制した 0.28.1 (platform 別 optionalDeps 含む) と、頻繁に publish される
# browserslist 系データ (caniuse-lite 等)。esbuild 0.28.1 は age 超過後の再生成で消える。
minimumReleaseAgeExclude:
  - "@esbuild/aix-ppc64@0.28.1"
  - "@esbuild/android-arm@0.28.1"
  - "@esbuild/android-arm64@0.28.1"
  - "@esbuild/android-x64@0.28.1"
  - "@esbuild/darwin-arm64@0.28.1"
  - "@esbuild/darwin-x64@0.28.1"
  - "@esbuild/freebsd-arm64@0.28.1"
  - "@esbuild/freebsd-x64@0.28.1"
  - "@esbuild/linux-arm@0.28.1"
  - "@esbuild/linux-arm64@0.28.1"
  - "@esbuild/linux-ia32@0.28.1"
  - "@esbuild/linux-loong64@0.28.1"
  - "@esbuild/linux-mips64el@0.28.1"
  - "@esbuild/linux-ppc64@0.28.1"
  - "@esbuild/linux-riscv64@0.28.1"
  - "@esbuild/linux-s390x@0.28.1"
  - "@esbuild/linux-x64@0.28.1"
  - "@esbuild/netbsd-arm64@0.28.1"
  - "@esbuild/netbsd-x64@0.28.1"
  - "@esbuild/openbsd-arm64@0.28.1"
  - "@esbuild/openbsd-x64@0.28.1"
  - "@esbuild/openharmony-arm64@0.28.1"
  - "@esbuild/sunos-x64@0.28.1"
  - "@esbuild/win32-arm64@0.28.1"
  - "@esbuild/win32-ia32@0.28.1"
  - "@esbuild/win32-x64@0.28.1"
  - "baseline-browser-mapping@2.10.36"
  - "caniuse-lite@1.0.30001799"
  - "electron-to-chromium@1.5.372"
  - "enhanced-resolve@5.24.0"
  - "esbuild@0.28.1"

# 新規 install/add で ^/~ を付けず exact 版で書く。
# 既存の ^ は scripts/pin-deps.mjs で別途剥がす。
saveExact: true

# engines.node 範囲外の Node で install/run を fail。
engineStrict: true

# pnpm dev / pnpm test 等の起動前に node_modules と lockfile の同期を強制検証。
# 'error' で drift 即 fail。'warn' に下げると警告のみ。
# 旧来は `pnpm install --config.minimum-release-age=0` で生じる state file の
# drift を許容するために warn に下げていたが、minimumReleaseAgeExclude で
# young version を policy 例外にする方式に切り替えたため、override 不要で
# drift も起きなくなり error に復帰可能。
verifyDepsBeforeRun: error

# install 末尾の "X packages are looking for funding" を非表示。
fund: false
